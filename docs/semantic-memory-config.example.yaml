memory:
  enabled: true
  short_term:
    enabled: true
    key_prefix: nanobot:stm
    conversation_ttl: 86400
    task_ttl: 86400
    reasoning_ttl: 21600
    tool_ttl: 86400
    run_state_ttl: 3600
    context_ttl: 21600
    max_messages: 200
    max_tool_result_chars: 20000
    runtime_context_messages: 12
    runtime_context_tasks: 8
    runtime_context_tools: 12
    runtime_context_max_chars: 12000
  record:
    enabled: true
    mode: best_effort
    max_retries: 3
    retry_backoff: exponential
    conflict_strategy: latest_wins
    min_confidence: 0.6
    llm:
      model: null
      temperature: 0.1
      max_tokens: 2048
    idempotency:
      key_strategy: source_ids_and_batch
      store: redis
      ttl: 86400

  retrieve:
    enabled: true
    trigger: first_turn
    recent_turns: 3
    max_injected_chars: 6000
    min_confidence: 0.6
    vector:
      top_k: 20
      score_threshold: 0.7
      hnsw_ef: 128
    graph:
      enabled: true
      max_depth: 2
      timeout_ms: 100
    reranker:
      model: BAAI/bge-reranker-v2-m3
      top_n: 5
      timeout_ms: 200
      fallback: original_order
      max_batch_size: 32
    cache:
      warm_cache_enabled: true
      redis_ttl: 3600
      preload_fields: [preferences, static_profile]

  file_sync:
    enabled: true
    cron: "0 3 * * 0"  # Sunday 03:00 in the agent timezone
    min_confidence: 0.85
    max_records: 100
    max_chars: 20000

  storage:
    embedding:
      provider: openai
      model: text-embedding-3-large
      dimension: 3072
    vector_db:
      type: qdrant
      host: localhost
      rest_port: 6333
      port: 6334
      collection_prefix: agent_memory
      prefer_grpc: true
      hnsw_m: 16
      hnsw_ef_construct: 128
      api_key: null
      https: false
    graph_db:
      type: neo4j
      uri: bolt://localhost:7687
      database: neo4j
      username: neo4j
      password: nanobot-memory
      initialize_schema: true
    metadata_db:
      type: postgresql
      dsn: ${DATABASE_URL}
      min_pool_size: 1
      max_pool_size: 10
    redis:
      url: redis://localhost:6379/0
      socket_timeout: 2
